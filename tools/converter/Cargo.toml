[package]
name = "harmonios-converter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harmonios"
path = "src/main.rs"

[dependencies]
harmonios-runtime = { path = "../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
plist = "1.6"
flate2 = "1"
sha2 = "0.10"
crc32fast = "1"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
