[package]
name = "harmonios-converter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harmonios"
path = "src/main.rs"

[dependencies]
harmonios-runtime = { path = "../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
plist = "1.6"
